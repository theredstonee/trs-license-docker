# TRS License — Caddy davor: Port 80/443, Zertifikat von Let's Encrypt kommt von selbst.
# Aktiv, wenn in .env steht:  COMPOSE_FILE=docker-compose.yml:compose.caddy.yml
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
