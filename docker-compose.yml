#
# Start:   docker compose up -d
# Danach:  die Adresse aus der Installation im Browser oeffnen und dem Assistenten folgen.
# Den Setup-Code zeigt:  docker compose logs app | grep Setup-Code
#
# Diese Datei enthaelt nur App und Datenbank. Wie das Panel nach aussen kommt, legt COMPOSE_FILE
# in der .env fest (install.sh setzt das automatisch):
#   docker-compose.yml:compose.caddy.yml   eigener Caddy auf Port 80/443 mit automatischem HTTPS
#   docker-compose.yml:compose.port.yml    nur ein Port auf 127.0.0.1 hinter deinem nginx/Apache
#
# Vorher in der Datei .env ein eigenes Datenbank-Passwort setzen (siehe .env.example).
services:
  app:
    image: ghcr.io/theredstonee/trs-license:latest
    restart: unless-stopped
    environment:
      NUXT_DB_URL: postgres://trs:${DB_PASSWORD:?Bitte DB_PASSWORD in .env setzen}@db:5432/trs_license
      TZ: ${TZ:-Europe/Berlin}
      # Notausgang bei verlorener Zwei-Faktor-Anmeldung, siehe README (normalerweise leer).
      TRS_RESET_2FA: ${TRS_RESET_2FA:-}
    depends_on:
      db:
        condition: service_healthy
    # Nicht direkt nach aussen geoeffnet — erreichbar nur ueber Caddy oder den Port aus compose.port.yml.
    expose: ["3000"]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trs
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: trs_license
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trs -d trs_license"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db:
