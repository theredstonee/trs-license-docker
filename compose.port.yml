# TRS License — ohne eigenen Caddy: die App hoert auf EINEM Port, dein vorhandener Webserver
# (nginx, Apache, Plesk …) leitet die Domain dorthin weiter und macht HTTPS.
# Aktiv, wenn in .env steht:  COMPOSE_FILE=docker-compose.yml:compose.port.yml
#
#   TRS_PORT=8080            der Port (install.sh sucht einen freien)
#   TRS_BIND=127.0.0.1       nur von diesem Server aus erreichbar (Standard); 0.0.0.0 = von ueberall
#   TRS_PROXY_DOMAIN=…       Domain, unter der dein Webserver das Panel ausliefert (optional)
#
# Dein Webserver muss die Header Host, X-Forwarded-Proto und X-Forwarded-For setzen — die
# Vorlage dafuer zeigt install.sh und das Panel unter Einstellungen → Verbindung.
services:
  app:
    ports:
      - "${TRS_BIND:-127.0.0.1}:${TRS_PORT:?Bitte TRS_PORT in .env setzen}:3000"
    environment:
      TRS_PORT: ${TRS_PORT}
      TRS_BIND: ${TRS_BIND:-127.0.0.1}
      TRS_PROXY_DOMAIN: ${TRS_PROXY_DOMAIN:-}
